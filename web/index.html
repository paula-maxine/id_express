<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ID Express">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.ico"/>

  <title>ID Express</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Detect a new deployment and clear stale caches before loading the app.
    //
    // version.txt holds the current "version+build" string and is served
    // with no-cache headers (see firebase.json). On a version mismatch we
    // wipe the Cache API and unregister the old service worker so the freshly
    // deployed bootstrap / main.dart.js are fetched instead of stale copies.
    //
    // Runs (and awaits) before flutter_bootstrap.js is injected below, so the
    // stale service worker/cache can't race the fresh app load.
    async function checkAndClearCache() {
      try {
        const response = await fetch("/version.txt?v=2" + Date.now(), {
          cache: "no-store",
        });
        if (!response.ok) return;

        const buildNumber = (await response.text()).trim();
        if (!buildNumber) return;

        const currentBuild = localStorage.getItem("buildNumber");
        if (currentBuild === buildNumber) return;

        console.log("[CACHE] New build detected:", buildNumber);

        if ("caches" in window) {
          const names = await caches.keys();
          await Promise.all(names.map((name) => caches.delete(name)));
          console.log("[CACHE] All caches cleared.");
        }

        if ("serviceWorker" in navigator) {
          const registrations =
            await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((reg) => reg.unregister()));
        }

        localStorage.setItem("buildNumber", buildNumber);
      } catch (error) {
        console.warn("[CACHE] Version check failed:", error);
      } finally {
        const script = document.createElement("script");
        script.src = "flutter_bootstrap.js";
        script.async = true;
        document.body.appendChild(script);
      }
    }
  </script>
</head>
<body onload="checkAndClearCache()">
</body>
</html>
